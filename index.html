<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DEEP CTI & SOC Live Platform</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #070d19;
      --panel: #0f172a;
      --card: #111c33;
      --border: #26354f;
      --accent: #3b82f6;
      --text: #f8fafc;
      --subtext: #cbd5e1;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: var(--tg-viewport-stable-height, 100vh);
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { padding: 12px; }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #172554 100%);
      border: 1px solid #3b82f666;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .header h1 { margin: 0; font-size: 17px; color: var(--text); }
    .pill {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #10b98126;
      color: #6ee7b7;
      border: 1px solid #10b98166;
      font-weight: 600;
    }
    .sub { color: var(--subtext); font-size: 12px; margin-top: 6px; line-height: 1.4; }
    .tabs, .row-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s ease;
    }
    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }
    button.small { padding: 6px 10px; font-size: 11px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; line-height: 1.35; color: var(--text); }
    .muted { color: var(--subtext); font-size: 12px; line-height: 1.45; }
    .impact-box {
      margin-top: 6px;
      margin-bottom: 8px;
      padding: 8px 10px;
      border-radius: 8px;
      background: #081021;
      border-left: 3px solid #f59e0b;
      color: var(--text);
      font-size: 12px;
      line-height: 1.4;
    }
    .detail-box {
      margin-top: 6px;
      padding: 8px;
      border-radius: 8px;
      background: #070e1d;
      border: 1px dashed #3b4f70;
      color: var(--subtext);
      font-size: 11px;
      line-height: 1.45;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1d4ed844;
      color: #bfdbfe;
      margin-right: 6px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .badge.crit { background: #dc262644; color: #fecaca; }
    .badge.high { background: #d9770644; color: #fde68a; }
    .badge.med { background: #ca8a0444; color: #fef08a; }
    .badge.ok { background: #05966944; color: #a7f3d0; }
    .badge.dw { background: #7e22ce44; color: #e9d5ff; }
    pre {
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      overflow-x: auto;
      font-size: 12px;
      color: #a7f3d0;
      line-height: 1.45;
      margin: 8px 0;
    }
    input, select {
      width: 100%;
      background: #030712;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    a { color: #93c5fd; text-decoration: none; font-size: 12px; }
    .toast { color: #6ee7b7; font-size: 12px; margin-left: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <h1>🛡️ DEEP CTI & SOC Live Platform</h1>
      <span class="pill">TOR + 5 CTI APIS + LIVE RW</span>
    </div>
    <div class="sub" id="updatedAt">Loading live CTI data... • Auto schedule: 12:00 + every 3h (+04)</div>
  </div>

  <div class="tabs" id="mainTabs">
    <button class="active" data-tab="news" onclick="switchTab('news')">📰 News & Impact</button>
    <button data-tab="darkweb" onclick="switchTab('darkweb')">🕵️ Darkweb & Tor</button>
    <button data-tab="ransomware" onclick="switchTab('ransomware')">💀 Ransomware & CVE</button>
    <button data-tab="ioc" onclick="switchTab('ioc')">🔍 IoC & Scores</button>
    <button data-tab="apt" onclick="switchTab('apt')">⚡ APT & Groups</button>
    <button data-tab="hunting" onclick="switchTab('hunting')">🎯 Hunting</button>
    <button data-tab="sources" onclick="switchTab('sources')">📡 Sources</button>
  </div>

  <div id="view"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    function goFullScreen() {
      if (!tg) return;
      tg.ready();
      tg.expand();
      if (typeof tg.requestFullscreen === "function") {
        try { tg.requestFullscreen(); } catch (e) {}
      }
    }
    goFullScreen();
    setTimeout(goFullScreen, 200);
    setTimeout(goFullScreen, 700);

    const state = {
      tab: "news",
      platform: "xql",
      scenario: "token_replay",
      targetScope: "*",
      windowHours: "24",
      levelFilter: "ALL",
      selectedIoc: "",
      aptSearch: "",
      copied: "",
      soarPlaybook: "",
      data: {
        updated_at: "Loading...",
        sources: [],
        news: [],
        cves: [],
        iocs: [],
        active_apts: [],
        live_ransomware: []
      }
    };

    const SCENARIO_META = {
      token_replay: { title: "Token Replay & Session Hijacking", mitre: "T1539 / T1550.004" },
      infostealer: { title: "Endpoint Infostealer & Cookie Theft", mitre: "T1555.003 / T1539" },
      api_leak: { title: "API / Cloud Secret & Token Exposure", mitre: "T1552.001 / T1567" },
      rce_web: { title: "Web / Edge Exploitation & Child Process", mitre: "T1190 / T1059" },
      c2_lateral: { title: "C2 Beaconing & Lateral Movement", mitre: "T1071 / T1570" }
    };

    function detectScenarioFromText(text) {
      const t = (text || "").toLowerCase();
      if (t.includes("rce") || t.includes("web") || t.includes("exploit") || t.includes("cve-")) return "rce_web";
      if (t.includes("stealer") || t.includes("cookie") || t.includes("credential")) return "infostealer";
      if (t.includes("token") || t.includes("session") || t.includes("auth") || t.includes("mfa")) return "token_replay";
      if (t.includes("api") || t.includes("secret") || t.includes("cloud") || t.includes("key")) return "api_leak";
      return "c2_lateral";
    }

    function levelBadgeClass(lvl) {
      if (lvl === "CRITICAL") return "crit";
      if (lvl === "HIGH") return "high";
      if (lvl === "MEDIUM") return "med";
      return "ok";
    }

    function dedupArrayByKey(arr, keyFn) {
      const seen = new Set();
      return (arr || []).filter(item => {
        const k = keyFn(item);
        if (!k || seen.has(k)) return false;
        seen.add(k);
        return true;
      });
    }

    function buildHuntingQuery(scenario, plat, scope, hours) {
      const s = (scope || "*").trim();
      const h = parseInt(hours || "24", 10) || 24;
      const scopeFilter = s === "*" ? "" : ` and (agent_hostname contains "${s}" or user_name contains "${s}" or action_remote_ip = "${s}")`;

      if (scenario === "token_replay") {
        if (plat === "xql") return `dataset = identity_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.AUTHENTICATION and auth_status = ENUM.SUCCESS${scopeFilter}\n| comp count_distinct(asn_org) as asns, count_distinct(user_agent) as uas by user_name, session_id\n| filter asns > 1 or uas > 1`;
        if (plat === "kql") return `SigninLogs\n| where TimeGenerated > ago(${h}h) and ResultType == 0${s !== "*" ? ` and (UserPrincipalName has "${s}" or IPAddress == "${s}")` : ""}\n| summarize ASNs=dcount(AutonomousSystemNumber), UAs=dcount(UserAgent) by UserPrincipalName, OriginalRequestId\n| where ASNs > 1 or UAs > 1`;
        if (plat === "spl") return `index=identity earliest=-${h}h status=success${s !== "*" ? ` ("${s}")` : ""}\n| stats dc(src_ip) as ips dc(http_user_agent) as uas by user, session_id\n| where ips > 1 OR uas > 1`;
        if (plat === "wazuh") return `data.win.eventdata.targetUserName:* AND rule.groups:authentication_success${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT username, UNIQUECOUNT(sourceip) AS ips, UNIQUECOUNT("User Agent") AS uas FROM events WHERE 1=1${s !== "*" ? ` AND ("Username" ILIKE '%${s}%' OR "Source IP" = '${s}')` : ""} GROUP BY username HAVING ips > 1 OR uas > 1 LAST ${h} HOURS`;
      }

      if (scenario === "infostealer") {
        if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.FILE and action_file_path ~= ".*(Chrome|Edge|Firefox)\\\\User Data\\\\.*(Login Data|Cookies|key4\\.db)$"${scopeFilter}\n| filter actor_process_image_name not in ("chrome.exe", "msedge.exe", "firefox.exe")`;
        if (plat === "kql") return `DeviceFileEvents\n| where Timestamp > ago(${h}h) and FolderPath has_any ("Chrome\\\\User Data", "Edge\\\\User Data") and FileName in~ ("Login Data", "Cookies")${s !== "*" ? ` and (DeviceName has "${s}" or InitiatingProcessAccountName has "${s}")` : ""}\n| where InitiatingProcessFileName !in~ ("chrome.exe", "msedge.exe")`;
        if (plat === "spl") return `index=endpoint earliest=-${h}h (file_path="*Chrome*Login Data*" OR file_path="*Cookies*") NOT process_name IN ("chrome.exe","msedge.exe")${s !== "*" ? ` ("${s}")` : ""}`;
        if (plat === "wazuh") return `data.win.eventdata.targetFilename:*User Data* AND NOT data.win.eventdata.image:*chrome.exe${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT hostname, "Process Name", "Target Filename" FROM events WHERE ("Target Filename" ILIKE '%Login Data%' OR "Target Filename" ILIKE '%Cookies%') AND "Process Name" NOT ILIKE '%chrome.exe'${s !== "*" ? ` AND hostname ILIKE '%${s}%'` : ""} LAST ${h} HOURS`;
      }

      if (scenario === "api_leak") {
        if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.FILE and action_file_path ~= ".*(\\.env|credentials|id_rsa|token|secret|kubeconfig).*"${scopeFilter}\n| fields _time, agent_hostname, actor_primary_username, actor_process_image_name, action_file_path`;
        if (plat === "kql") return `DeviceFileEvents\n| where Timestamp > ago(${h}h) and FileName has_any (".env", "credentials", "id_rsa", "secret", "token")${s !== "*" ? ` and DeviceName has "${s}"` : ""}\n| summarize Hits=count(), Files=make_set(FileName) by DeviceName, InitiatingProcessFileName`;
        if (plat === "spl") return `index=* earliest=-${h}h (".env" OR "id_rsa" OR "AWS_SECRET" OR "API_KEY" OR "BEARER")${s !== "*" ? ` ("${s}")` : ""}\n| stats count values(host) as hosts values(user) as users`;
        if (plat === "wazuh") return `(syscheck.path:*.env* OR data.win.eventdata.targetFilename:*.env*)${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT hostname, username, "Target Filename", COUNT(*) AS Hits FROM events WHERE ("Target Filename" ILIKE '%.env%' OR "Target Filename" ILIKE '%credentials%')${s !== "*" ? ` AND hostname ILIKE '%${s}%'` : ""} GROUP BY hostname, username, "Target Filename" LAST ${h} HOURS`;
      }

      if (scenario === "rce_web") {
        if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and actor_process_image_name in ("w3wp.exe","httpd","nginx","apache2","java","python3","node") and causality_actor_process_image_name in ("cmd.exe","powershell.exe","pwsh.exe","sh","bash")${scopeFilter}`;
        if (plat === "kql") return `DeviceProcessEvents\n| where Timestamp > ago(${h}h) and InitiatingProcessFileName has_any ("w3wp.exe","nginx","apache2","java","node") and FileName in~ ("cmd.exe","powershell.exe","pwsh.exe","sh","bash")${s !== "*" ? ` and DeviceName has "${s}"` : ""}`;
        if (plat === "spl") return `index=web earliest=-${h}h (status=500 OR status=403) (uri_path="*../*" OR uri_path="*cmd=*" OR uri_path="*eval*")${s !== "*" ? ` ("${s}")` : ""}\n| stats count by src_ip, uri_path, status`;
        if (plat === "wazuh") return `rule.groups:(web|attack) AND (data.srcip:* OR data.url:*)${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT "Source IP", hostname, "URL", COUNT(*) AS Hits FROM events WHERE ("URL" ILIKE '%../%' OR "URL" ILIKE '%cmd=%' OR "URL" ILIKE '%select+%')${s !== "*" ? ` AND ("Source IP" = '${s}' OR hostname ILIKE '%${s}%')` : ""} GROUP BY "Source IP", hostname, "URL" LAST ${h} HOURS`;
      }

      if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.NETWORK${scopeFilter}\n| comp count() as conn_cnt, count_distinct(action_remote_ip) as uniq_ips by agent_hostname, actor_process_image_name\n| filter conn_cnt > 50 or uniq_ips > 15`;
      if (plat === "kql") return `DeviceNetworkEvents\n| where Timestamp > ago(${h}h) and RemotePort in (4444, 8443, 9001, 1080, 5985)${s !== "*" ? ` and (DeviceName has "${s}" or RemoteIP == "${s}")` : ""}\n| summarize Count=count(), RemoteIPs=make_set(RemoteIP) by DeviceName, InitiatingProcessFileName`;
      if (plat === "spl") return `index=network earliest=-${h}h dest_port IN (4444,8443,9001,1080,5985)${s !== "*" ? ` ("${s}")` : ""}\n| stats count values(src_ip) as srcs values(dest_ip) as dsts by host`;
      if (plat === "wazuh") return `data.dstport:(4444 OR 8443 OR 9001 OR 1080)${s !== "*" ? ` AND "${s}"` : ""}`;
      return `SELECT hostname, "Source IP", "Destination IP", "Destination Port", COUNT(*) AS Hits FROM events WHERE "Destination Port" IN (4444,8443,9001,1080)${s !== "*" ? ` AND ("Source IP" = '${s}' OR "Destination IP" = '${s}')` : ""} GROUP BY hostname, "Source IP", "Destination IP", "Destination Port" LAST ${h} HOURS`;
    }

    function buildSoarCommand(actionType, target) {
      const v = (target || "target").trim();
      if (actionType === "block") {
        return `# Block Rule (${v})\niptables -I INPUT -s ${v} -j DROP && iptables -I OUTPUT -d ${v} -j DROP`;
      }
      return `# Revoke Session (${v})\nRevoke-MgUserSignInSession -UserId "${v}"`;
    }

    function copyVal(text, label = "Copied") {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      state.copied = "✓ " + label;
      render();
      setTimeout(() => { state.copied = ""; render(); }, 1600);
    }

    function switchTab(tab) {
      state.tab = tab;
      state.copied = "";
      document.querySelectorAll("#mainTabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      render();
    }

    function platformBar(current, onSelectExpr) {
      return `<div class="row-scroll">${["xql", "kql", "spl", "wazuh", "aql"].map(p =>
        `<button class="${current === p ? "active" : ""}" onclick="${onSelectExpr.replace("__P__", p)}">${p.toUpperCase()}</button>`
      ).join("")}</div>`;
    }

    function renderNewsCards(items, isDarkwebView) {
      if (!items.length) {
        return `<div class="card muted">No unique entries available for this section yet. Run the workflow to collect fresh data.</div>`;
      }
      return items.map(n => {
        const sc = detectScenarioFromText(`${n.title} ${n.summary}`);
        const ctryBadges = (n.countries || []).map(c => `<span class="badge high">${c}</span>`).join("");
        return `
          <div class="card">
            <span class="badge ${isDarkwebView ? "dw" : ""}">${isDarkwebView ? "DARKWEB / TOR / LEAK" : "CYBER NEWS"}</span>
            <span class="badge">${n.source}</span>
            <span class="badge ok">${n.date || ""}</span>
            ${ctryBadges}
            <div class="card-title">${n.title}</div>
            <div class="muted">${n.summary || ""}</div>
            <div class="impact-box"><b>Impact:</b> ${n.impact || "Review against active environment controls."}</div>
            <div class="row-scroll" style="margin-bottom:0;">
              <a href="${n.url}" target="_blank" rel="noopener"><button type="button" class="small">Open Source →</button></a>
              <button type="button" class="small" onclick="state.scenario='${sc}';switchTab('hunting')">🎯 Hunt (${sc})</button>
            </div>
          </div>
        `;
      }).join("");
    }

    function render() {
      const view = document.getElementById("view");
      const toast = state.copied ? `<span class="toast">${state.copied}</span>` : "";
      const uniqueNews = dedupArrayByKey(state.data.news, n => `${(n.url || "").toLowerCase()}|${(n.title || "").toLowerCase().slice(0, 80)}`);

      if (state.tab === "news") {
        const globalList = uniqueNews.filter(n => (n.category || "global_cyber") !== "darkweb_cti");
        view.innerHTML = `
          <div class="card">
            <div class="card-title">🌍 Global Cyber News & Operational Impact (${globalList.length})</div>
            <div class="muted">Every item includes impact assessment and direct threat hunting handoff.</div>
          </div>
          ${renderNewsCards(globalList, false)}
        `;
      }

      else if (state.tab === "darkweb") {
        const dwList = uniqueNews.filter(n => n.category === "darkweb_cti");
        view.innerHTML = `
          <div class="card">
            <div class="card-title">🕵️ Darkweb, Leaks & Tor (.onion) Feed (${dwList.length})</div>
            <div class="muted">.onion sources are queried over Tor SOCKS5 when Tor is running in the runner, alongside leak/ransomware feeds.</div>
          </div>
          ${renderNewsCards(dwList, true)}
        `;
      }

      else if (state.tab === "ransomware") {
        const rw = dedupArrayByKey(state.data.live_ransomware, r => `${(r.group || "").toLowerCase()}|${(r.victim || "").toLowerCase()}|${(r.country || "").toLowerCase()}`);
        const cves = dedupArrayByKey(state.data.cves, c => c.cveID);

        view.innerHTML = `
          <div class="card">
            <div class="card-title">💀 Live Ransomware Activity & Latest Countries (${rw.length})</div>
            <div class="muted">Latest victims, groups and target countries from live ransomware feeds & intel.</div>
          </div>
          ${rw.length ? rw.map(r => `
            <div class="card">
              <span class="badge crit">${r.country || "Global"}</span>
              <span class="badge high">${r.group || "Group"}</span>
              <span class="badge ok">${r.date || ""}</span>
              <div class="card-title">${r.victim || ""}</div>
              <div class="muted">Source: ${r.source || "Ransomware Intel"}</div>
            </div>
          `).join("") : `<div class="card muted">No live ransomware items collected in this run.</div>`}

          <div class="card">
            <div class="card-title">⚠️ CISA Known Exploited Vulnerabilities (${cves.length})</div>
          </div>
          ${cves.map(c => `
            <div class="card">
              <span class="badge crit">${c.cveID}</span>
              <span class="badge high">${c.dateAdded || ""}</span>
              <div class="card-title">${c.vendor || ""} — ${c.product || ""}</div>
              <div style="font-size:13px;margin-bottom:4px;">${c.name || ""}</div>
              <div class="impact-box"><b>Action & Impact:</b> ${c.action || "Apply vendor patch immediately."}</div>
              <button class="small" onclick="state.selectedIoc='${c.cveID}';switchTab('ioc')">🔍 View IoC Score</button>
            </div>
          `).join("")}
        `;
      }

      else if (state.tab === "ioc") {
        const allIocs = dedupArrayByKey(state.data.iocs, x => `${x.type}:${x.value}`);
        const filtered = allIocs.filter(x => state.levelFilter === "ALL" || x.level === state.levelFilter);
        const activeIoc = allIocs.find(x => x.value === state.selectedIoc) || filtered[0] || allIocs[0];

        view.innerHTML = `
          <div class="card">
            <div class="card-title">🔍 Automated IoC Analysis, Tool Results & Total Score</div>
            <div class="muted">All IoCs are automatically extracted, deduplicated, checked across CTI tools, and scored.</div>
            <div class="row-scroll" style="margin-top:8px;">
              ${["ALL", "CRITICAL", "HIGH", "MEDIUM", "LOW"].map(lvl =>
                `<button class="small ${state.levelFilter === lvl ? "active" : ""}" onclick="state.levelFilter='${lvl}';render()">${lvl}</button>`
              ).join("")}
            </div>
            ${activeIoc ? `
              <div class="detail-box">
                <span class="badge ${levelBadgeClass(activeIoc.level)}">${activeIoc.level} • TOTAL SCORE: ${activeIoc.score}</span>
                <span class="badge">${(activeIoc.type || "ioc").toUpperCase()}</span>
                <div style="font-weight:700;font-size:13px;color:#f8fafc;margin:4px 0;word-break:break-all;">${activeIoc.value}</div>
                <div><b>Origin Source:</b> ${activeIoc.origin || "CTI Feed"}</div>
                <div><b>Verdict:</b> ${activeIoc.verdict || ""}</div>
                <div style="margin-top:6px;"><b>Tool-by-Tool Results:</b><br/>${(activeIoc.source_results || []).map(r => `• ${r}`).join("<br/>")}</div>
              </div>
              <div class="row-scroll" style="margin-top:8px;margin-bottom:0;">
                <button class="small" onclick="state.soarPlaybook=buildSoarCommand('block', '${String(activeIoc.value).replace(/'/g, "\\'")}');render()">🛡️ Block Command</button>
                <button class="small" onclick="state.soarPlaybook=buildSoarCommand('revoke', '${String(activeIoc.value).replace(/'/g, "\\'")}');render()">🔑 Revoke Session</button>
                ${state.soarPlaybook ? `<button class="small" onclick="copyVal(state.soarPlaybook, 'Command copied')">📋 Copy</button>` : ""}
              </div>
              ${toast}
              ${state.soarPlaybook ? `<pre>${state.soarPlaybook}</pre>` : ""}
            ` : `<div class="muted" style="margin-top:8px;">No IoCs found in current collection.</div>`}
          </div>

          <div class="card">
            <div class="card-title">Unique IoCs (${filtered.length}/${allIocs.length})</div>
            ${filtered.map(item => `
              <div style="border-top:1px solid var(--border);padding:8px 0;">
                <span class="badge ${levelBadgeClass(item.level)}">${item.level} • Score ${item.score}</span>
                <span class="badge">${(item.type || "ioc").toUpperCase()}</span>
                <div style="font-weight:700;font-size:13px;word-break:break-all;">${item.value}</div>
                <div class="muted">Source: ${item.origin || ""}</div>
                <div class="muted">Tools: ${(item.source_results || []).join(" | ")}</div>
                <div style="margin-top:6px;">
                  <button class="small" onclick="state.selectedIoc='${String(item.value).replace(/'/g, "\\'")}';render()">📊 Inspect Score & Tools</button>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }

      else if (state.tab === "apt") {
        const apts = dedupArrayByKey(state.data.active_apts, a => a.id || a.name);
        const q = (state.aptSearch || "").trim().toLowerCase();
        const list = apts.filter(a => !q || `${a.name} ${a.focus} ${a.mitigation}`.toLowerCase().includes(q));

        view.innerHTML = `
          <div class="card">
            <div class="card-title">⚡ Live Detected APT & Threat Groups (${list.length})</div>
            <div class="muted" style="margin-bottom:8px;">Only groups matched in current collected news/KEV sources are shown.</div>
            <input value="${state.aptSearch}" oninput="state.aptSearch=this.value;render()" placeholder="Filter detected APT groups..." />
          </div>
          ${list.length ? list.map(a => {
            const techs = a.techniques || [];
            const mentions = a.mentions || [];
            const scopeVal = (a.name || "APT").split(" ")[0];
            return `
              <div class="card">
                <span class="badge ${levelBadgeClass(a.level)}">${a.level} • Score ${a.activity_score}</span>
                <span class="badge ok">${a.status_label}</span>
                <div class="card-title">${a.name}</div>
                <div class="muted"><b>Focus:</b> ${a.focus}</div>
                <div class="muted" style="margin-bottom:6px;"><b>Mitigation:</b> ${a.mitigation}</div>
                <div style="margin-bottom:8px;">
                  ${techs.map(t => `<a href="${t.url}" target="_blank" rel="noopener"><span class="badge">${t.id} — ${t.name}</span></a>`).join("")}
                </div>
                ${mentions.length ? `<div class="detail-box" style="margin-bottom:8px;"><b>Source Matches:</b><br/>${mentions.map(m => `• [${m.source}] ${m.title}`).join("<br/>")}</div>` : ""}
                <button class="small" onclick="state.scenario='${a.scenario || "token_replay"}';state.targetScope='${scopeVal}';switchTab('hunting')">🎯 Hunt This Group</button>
              </div>
            `;
          }).join("") : `<div class="card muted">No APT groups matched in the current collected data.</div>`}
        `;
      }

      else if (state.tab === "hunting") {
        const meta = SCENARIO_META[state.scenario];
        const queryText = buildHuntingQuery(state.scenario, state.platform, state.targetScope, state.windowHours);
        view.innerHTML = `
          <div class="row-scroll">
            ${Object.keys(SCENARIO_META).map(k =>
              `<button class="${state.scenario === k ? "active" : ""}" onclick="state.scenario='${k}';render()">${k.replace("_", " ").toUpperCase()}</button>`
            ).join("")}
          </div>
          ${platformBar(state.platform, "state.platform='__P__';render()")}
          <div class="card">
            <div class="grid-2">
              <input value="${state.targetScope}" oninput="state.targetScope=this.value;render()" placeholder="Scope (*, host, user, IP, APT)..." />
              <select onchange="state.windowHours=this.value;render()">
                <option value="6" ${state.windowHours === "6" ? "selected" : ""}>Last 6h</option>
                <option value="24" ${state.windowHours === "24" ? "selected" : ""}>Last 24h</option>
                <option value="72" ${state.windowHours === "72" ? "selected" : ""}>Last 72h</option>
                <option value="168" ${state.windowHours === "168" ? "selected" : ""}>Last 7d</option>
              </select>
            </div>
            <span class="badge ok">${meta.mitre}</span>
            <div class="card-title">${meta.title}</div>
            <pre id="huntBox">${queryText}</pre>
            <button onclick="copyVal(document.getElementById('huntBox').innerText, 'Query copied')">📋 Copy Query</button>${toast}
          </div>
        `;
      }

      else {
        const srcs = dedupArrayByKey(state.data.sources, s => (s.url || s.name || "").toLowerCase());
        view.innerHTML = srcs.map(s => `
          <div class="card">
            <span class="badge ok">${s.type || "Source"}</span>
            <div class="card-title">${s.name}</div>
            <a href="${s.url}" target="_blank" rel="noopener">${s.url}</a>
          </div>
        `).join("");
      }
    }

    fetch("./data.json?t=" + Date.now())
      .then(r => r.json())
      .then(d => {
        state.data = { ...state.data, ...d };
        if (!state.selectedIoc && (d.iocs || []).length) {
          state.selectedIoc = d.iocs[0].value;
        }
        document.getElementById("updatedAt").innerText =
          `Updated: ${d.updated_at} • Sources: ${(d.sources || []).length} • News: ${(d.news || []).length} • IoCs: ${(d.iocs || []).length} • APTs: ${(d.active_apts || []).length}`;
        render();
      })
      .catch(() => render());
  </script>
</body>
</html>
