<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SOC & CTI Operativ Konsolu</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #070d19;
      --panel: #0f172a;
      --card: #111c33;
      --border: #1e293b;
      --accent: #3b82f6;
      --accent-2: #06b6d4;
      --text: #f8fafc;
      --muted: #94a3b8;
      --crit: #ef4444;
      --high: #f59e0b;
      --ok: #10b981;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: var(--tg-viewport-stable-height, 100vh);
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { padding: 12px; }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #172554 100%);
      border: 1px solid #2563eb55;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .header h1 { margin: 0; font-size: 17px; }
    .pill {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #10b98122;
      color: #6ee7b7;
      border: 1px solid #10b98155;
    }
    .sub { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.4; }
    .tabs, .row-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s ease;
    }
    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.small { padding: 6px 10px; font-size: 11px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .muted { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1d4ed833;
      color: #93c5fd;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    .badge.crit { background: #dc262633; color: #fca5a5; }
    .badge.high { background: #d9770633; color: #fcd34d; }
    .badge.ok { background: #05966933; color: #6ee7b7; }
    pre {
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      overflow-x: auto;
      font-size: 12px;
      color: #a7f3d0;
      line-height: 1.45;
      margin: 8px 0;
    }
    input, select, textarea {
      width: 100%;
      background: #030712;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px;
      border-radius: 8px;
      background: #0b1324;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-size: 12px;
    }
    .check-item input { width: auto; margin: 2px 0 0; }
    a { color: #60a5fa; text-decoration: none; font-size: 12px; }
    .toast { color: #6ee7b7; font-size: 12px; margin-left: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <h1>🛡️ SOC & CTI Operativ Konsolu</h1>
      <span class="pill" id="statusPill">LIVE RADAR</span>
    </div>
    <div class="sub" id="updatedAt">Yenilənmə vaxtı yüklənir... • Avto-cədvəl: 12:00 + hər 3 saat (+04)</div>
  </div>

  <div class="tabs" id="mainTabs">
    <button class="active" data-tab="news" onclick="switchTab('news')">📰 Xəbərlər</button>
    <button data-tab="cve" onclick="switchTab('cve')">⚠️ CISA CVE</button>
    <button data-tab="hunting" onclick="switchTab('hunting')">🎯 Hunting</button>
    <button data-tab="ioc" onclick="switchTab('ioc')">🔍 IoC & SOAR</button>
    <button data-tab="defense" onclick="switchTab('defense')">🧱 Müdafiə & Aktor</button>
    <button data-tab="sources" onclick="switchTab('sources')">📡 Mənbələr</button>
  </div>

  <div id="view"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    function goFullScreen() {
      if (!tg) return;
      tg.ready();
      tg.expand();
      if (typeof tg.requestFullscreen === "function") {
        try { tg.requestFullscreen(); } catch (e) {}
      }
    }
    goFullScreen();
    setTimeout(goFullScreen, 200);
    setTimeout(goFullScreen, 700);

    const state = {
      tab: "news",
      platform: "xql",
      scenario: "token_replay",
      severityFilter: "all",
      selectedCve: "CVE-2026-132224",
      iocType: "ip",
      iocValue: "185.220.101.47",
      vpLayer: "waf",
      actorFilter: "all",
      selectedActor: "armory_castle",
      audience: "exec",
      copied: "",
      soarLog: "",
      audit: { waf: true, ips: true, edr: false },
      data: { updated_at: "Yüklənir...", sources: [], news: [], cves: [] }
    };

    const HUNTING = {
      token_replay: {
        title: "Token Replay & Session Hijacking (MFA Bypass)",
        mitre: "T1539 / T1550.004",
        xql: `dataset = identity_data\n| filter event_type = ENUM.AUTHENTICATION and auth_status = ENUM.SUCCESS\n| comp count_distinct(asn_org) as asns, count_distinct(user_agent) as uas by user_name, session_id\n| filter asns > 1 and uas > 1`,
        kql: `SigninLogs\n| where TimeGenerated > ago(24h) and ResultType == 0\n| summarize ASNs=dcount(AutonomousSystemNumber), UAs=dcount(UserAgent) by UserPrincipalName, OriginalRequestId\n| where ASNs > 1 or UAs > 1`,
        spl: `index=identity status=success\n| stats dc(src_ip) as ips dc(http_user_agent) as uas by user, session_id\n| where ips > 1 AND uas > 1`,
        wazuh: `data.win.eventdata.targetUserName:* AND rule.groups:authentication_success`,
        aql: `SELECT username, UNIQUECOUNT(sourceip) AS ips, UNIQUECOUNT("User Agent") AS uas FROM events GROUP BY username HAVING ips > 1 AND uas > 1 LAST 24 HOURS`
      },
      infostealer: {
        title: "Endpoint Infostealer (Login Data, Cookies & Session Theft)",
        mitre: "T1555.003 / T1539",
        xql: `dataset = xdr_data\n| filter event_type = ENUM.FILE and action_file_path ~= ".*(Chrome|Edge)\\\\User Data\\\\.*(Login Data|Cookies)$"\n| filter actor_process_image_name not in ("chrome.exe", "msedge.exe")`,
        kql: `DeviceFileEvents\n| where FolderPath has_any ("Chrome\\\\User Data", "Edge\\\\User Data") and FileName in~ ("Login Data", "Cookies")\n| where InitiatingProcessFileName !in~ ("chrome.exe", "msedge.exe")`,
        spl: `index=endpoint (file_path="*Chrome*Login Data*" OR file_path="*Cookies*") NOT process_name IN ("chrome.exe","msedge.exe")`,
        wazuh: `data.win.eventdata.targetFilename:*User Data* AND NOT data.win.eventdata.image:*chrome.exe`,
        aql: `SELECT hostname, "Process Name", "Target Filename" FROM events WHERE "Target Filename" ILIKE '%Login Data%' AND "Process Name" NOT ILIKE '%chrome.exe' LAST 24 HOURS`
      },
      api_leak: {
        title: "API / Cloud Secret & Token Exfiltration",
        mitre: "T1552.001 / T1567",
        xql: `dataset = xdr_data\n| filter event_type = ENUM.FILE and action_file_path ~= ".*(\\.env|credentials|id_rsa|token|secret).*"\n| fields _time, agent_hostname, actor_primary_username, actor_process_image_name, action_file_path`,
        kql: `DeviceFileEvents\n| where FileName has_any (".env", "credentials", "id_rsa", "secret", "token")\n| summarize Hits=count(), Files=make_set(FileName) by DeviceName, InitiatingProcessFileName`,
        spl: `index=* (".env" OR "id_rsa" OR "AWS_SECRET" OR "API_KEY") | stats count values(host) as hosts values(user) as users`,
        wazuh: `syscheck.path:*.env* OR data.win.eventdata.targetFilename:*.env*`,
        aql: `SELECT hostname, username, "Target Filename", COUNT(*) AS Hits FROM events WHERE "Target Filename" ILIKE '%.env%' OR "Target Filename" ILIKE '%credentials%' GROUP BY hostname, username, "Target Filename" LAST 24 HOURS`
      }
    };

    const LAYERS = {
      waf: {
        name: "WAF & Edge Ingress",
        desc: "Web tətbiq hücumları, bot/credential stuffing və CSRF/RCE sorğularını kənar sərhəddə bloklayır.",
        rule: "Block anomalous burst POST/API requests + enforce strict header & session token validation."
      },
      ips: {
        name: "IPS / Perimeter & Tunnel",
        desc: "Gizli tunellər, qeyri-standart portlar və komprometə olunmuş ID/gateway çıxışlarını aşkarlayır.",
        rule: "Alert & drop unauthorized outbound C2/tunnel streams and anomalous management plane logins."
      },
      edr: {
        name: "EDR / Endpoint & Identity",
        desc: "Stealer proseslərini, brauzer fayl oğurluğunu və token replay anomaliyalarını host/identity səviyyəsində tutur.",
        rule: "Isolate host on unauthorized browser DB/secret access + revoke active sessions on token anomaly."
      }
    };

    const ACTORS = {
      armory_castle: {
        name: "Vishing & Cloud Identity Operators",
        cat: "identity",
        ttp: "Voice/Vishing lures, MFA prompt fatigue/token hijacking, cloud tenant pivoting",
        mitigation: "FIDO2/Phishing-resistant MFA, Conditional Access device compliance, session revocation."
      },
      stealer_eco: {
        name: "Infostealer & Log Brokering Ecosystem",
        cat: "stealer",
        ttp: "Browser session/cookie harvesting, stolen SaaS/VPN credentials, lateral webmail/API access",
        mitigation: "Credential rotation, browser token binding, EDR file-access alerting on Login Data/Cookies."
      }
    };

    function buildIocQuery(val, plat) {
      const v = (val || "185.220.101.47").trim();
      if (plat === "xql") return `dataset = xdr_data\n| filter action_remote_ip = "${v}" or dns_query_name contains "${v}" or actor_process_image_sha256 = "${v}"\n| fields _time, agent_hostname, actor_primary_username, actor_process_image_name, action_remote_ip`;
      if (plat === "kql") return `union DeviceNetworkEvents, DeviceProcessEvents, DeviceFileEvents\n| where RemoteIP == "${v}" or RemoteUrl has "${v}" or SHA256 == "${v}"`;
      if (plat === "spl") return `index=* ("${v}")\n| stats count earliest(_time) as first_seen latest(_time) as last_seen values(host) as hosts values(user) as users`;
      if (plat === "wazuh") return `data.srcip:${v} OR data.dstip:${v} OR data.dns.question.name:*${v}* OR syscheck.sha256:${v}`;
      return `SELECT hostname, username, "Source IP", "Destination IP", "URL" FROM events WHERE "Source IP" = '${v}' OR "Destination IP" = '${v}' OR "URL" ILIKE '%${v}%' LAST 7 DAYS`;
    }

    function copyVal(text, label = "Kopyalandı") {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      state.copied = "✓ " + label;
      render();
      setTimeout(() => { state.copied = ""; render(); }, 1600);
    }

    function runSoar(actionName) {
      const v = (state.iocValue || "185.220.101.47").trim();
      state.soarLog = `[${new Date().toLocaleTimeString("az-AZ")}] ${actionName} icra olundu → Hədəf: ${v} (Status: Queued / Playbook Ready)`;
      render();
    }

    function switchTab(tab) {
      state.tab = tab;
      state.copied = "";
      document.querySelectorAll("#mainTabs button").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === tab);
      });
      render();
    }

    function platformBar(current, onSelectExpr) {
      return `<div class="row-scroll">${["xql", "kql", "spl", "wazuh", "aql"].map(p =>
        `<button class="${current === p ? "active" : ""}" onclick="${onSelectExpr.replace("__P__", p)}">${p.toUpperCase()}</button>`
      ).join("")}</div>`;
    }

    function render() {
      const view = document.getElementById("view");
      const toast = state.copied ? `<span class="toast">${state.copied}</span>` : "";

      if (state.tab === "news") {
        const news = state.data.news || [];
        view.innerHTML = news.length ? news.map(n => `
          <div class="card">
            <span class="badge">${n.source}</span>
            <span class="badge ok">${n.date || ""}</span>
            <div class="card-title">${n.title}</div>
            <div class="muted" style="margin-bottom:8px;">${n.summary || ""}</div>
            <a href="${n.url}" target="_blank" rel="noopener">Mənbəni aç →</a>
          </div>
        `).join("") : `<div class="card muted">Hələ <code>data.json</code> məlumatı görünmür. GitHub Actions-ı işə salın.</div>`;
      }

      else if (state.tab === "cve") {
        const cves = state.data.cves || [];
        const filtered = cves.filter(c => {
          if (state.severityFilter === "ransomware") return String(c.ransomware || "").toLowerCase().includes("known");
          return true;
        });
        view.innerHTML = `
          <div class="row-scroll">
            <button class="${state.severityFilter === "all" ? "active" : ""}" onclick="state.severityFilter='all';render()">Hamısı (${cves.length})</button>
            <button class="${state.severityFilter === "ransomware" ? "active" : ""}" onclick="state.severityFilter='ransomware';render()">Ransomware KEV</button>
          </div>
          ${filtered.map(c => `
            <div class="card">
              <span class="badge crit">${c.cveID}</span>
              <span class="badge high">${c.dateAdded || ""}</span>
              ${String(c.ransomware || "").toLowerCase().includes("known") ? `<span class="badge crit">Ransomware</span>` : ""}
              <div class="card-title">${c.vendor || ""} — ${c.product || ""}</div>
              <div class="muted" style="margin-bottom:6px;">${c.name || ""}</div>
              <div class="muted"><b>Tələb olunan tədbir:</b> ${c.action || "Yama tətbiq edin"}</div>
              <div style="margin-top:8px;">
                <button class="small" onclick="state.iocValue='${c.cveID}';switchTab('ioc')">🔍 CVE üzrə IoC/Ov</button>
              </div>
            </div>
          `).join("") || `<div class="card muted">Bu filtr üzrə CVE tapılmadı.</div>`}
        `;
      }

      else if (state.tab === "hunting") {
        const sc = HUNTING[state.scenario];
        const queryText = sc[state.platform];
        view.innerHTML = `
          <div class="row-scroll">
            <button class="${state.scenario === "token_replay" ? "active" : ""}" onclick="state.scenario='token_replay';render()">Token Replay</button>
            <button class="${state.scenario === "infostealer" ? "active" : ""}" onclick="state.scenario='infostealer';render()">Infostealer</button>
            <button class="${state.scenario === "api_leak" ? "active" : ""}" onclick="state.scenario='api_leak';render()">API / Secret Leak</button>
          </div>
          ${platformBar(state.platform, "state.platform='__P__';render()")}
          <div class="card">
            <span class="badge ok">${sc.mitre}</span>
            <div class="card-title">${sc.title}</div>
            <pre id="huntCode">${queryText}</pre>
            <button onclick="copyVal(document.getElementById('huntCode').innerText, 'Hunting sorğusu kopyalandı')">📋 Sorğunu kopyala</button>${toast}
          </div>
        `;
      }

      else if (state.tab === "ioc") {
        const q = buildIocQuery(state.iocValue, state.platform);
        view.innerHTML = `
          <div class="card">
            <div class="card-title">IoC Axtarışı və SOAR Reaksiya</div>
            <select onchange="state.iocType=this.value;render()">
              <option value="ip" ${state.iocType === "ip" ? "selected" : ""}>IP Ünvanı</option>
              <option value="domain" ${state.iocType === "domain" ? "selected" : ""}>Domen / URL</option>
              <option value="hash" ${state.iocType === "hash" ? "selected" : ""}>SHA256 / File Hash</option>
            </select>
            <input value="${state.iocValue}" oninput="state.iocValue=this.value;render()" placeholder="IP, domen, hash və ya CVE daxil et..." />
            ${platformBar(state.platform, "state.platform='__P__';render()")}
            <pre id="iocCode">${q}</pre>
            <button onclick="copyVal(document.getElementById('iocCode').innerText, 'IoC sorğusu kopyalandı')">📋 Sorğunu kopyala</button>
            <button onclick="runSoar('Block IoC at Perimeter/WAF')">🛡️ Blokla (WAF/FW)</button>
            <button onclick="runSoar('Revoke Active User Sessions')">🔑 Sessiyaları Ləğv Et</button>${toast}
            ${state.soarLog ? `<div class="muted" style="margin-top:8px;color:#6ee7b7;">${state.soarLog}</div>` : ""}
          </div>
        `;
      }

      else if (state.tab === "defense") {
        const layer = LAYERS[state.vpLayer];
        const actor = ACTORS[state.selectedActor];
        const summary = state.audience === "exec"
          ? "Xülasə: Aktiv CISA KEV zəiflikləri və kimlik/stealer cəhdləri 3 saatlıq radar ilə izlənir; kritik sistemlərdə yama və sessiya nəzarəti prioritetdir."
          : "Texniki Xülasə: Identity ASN/UA anomaliyaları, brauzer Login Data/Cookies fayl girişləri və .env/token oxumaları XQL/KQL/SPL/Wazuh/AQL sorğuları ilə yoxlanılır.";
        view.innerHTML = `
          <div class="card">
            <div class="card-title">Müdafiə Qatları & Audit Yoxlaması</div>
            <div class="row-scroll">
              <button class="${state.vpLayer === "waf" ? "active" : ""}" onclick="state.vpLayer='waf';render()">WAF / Edge</button>
              <button class="${state.vpLayer === "ips" ? "active" : ""}" onclick="state.vpLayer='ips';render()">IPS / Perimetr</button>
              <button class="${state.vpLayer === "edr" ? "active" : ""}" onclick="state.vpLayer='edr';render()">EDR / Identity</button>
            </div>
            <div class="muted" style="margin-bottom:6px;"><b>${layer.name}:</b> ${layer.desc}</div>
            <pre>${layer.rule}</pre>
            <label class="check-item"><input type="checkbox" ${state.audit.waf ? "checked" : ""} onchange="state.audit.waf=this.checked" /> WAF / Edge qaydaları aktiv və yenilənib</label>
            <label class="check-item"><input type="checkbox" ${state.audit.ips ? "checked" : ""} onchange="state.audit.ips=this.checked" /> Perimetr / tunel və anomal çıxış logları yoxlanılıb</label>
            <label class="check-item"><input type="checkbox" ${state.audit.edr ? "checked" : ""} onchange="state.audit.edr=this.checked" /> EDR stealer və token replay alertləri triage edilib</label>
          </div>
          <div class="card">
            <div class="card-title">Təhdid Trendləri & Hesabat Baxışı</div>
            <div class="row-scroll">
              <button class="${state.selectedActor === "armory_castle" ? "active" : ""}" onclick="state.selectedActor='armory_castle';render()">Identity / Vishing</button>
              <button class="${state.selectedActor === "stealer_eco" ? "active" : ""}" onclick="state.selectedActor='stealer_eco';render()">Infostealer / Logs</button>
            </div>
            <div class="muted"><b>${actor.name}</b> — ${actor.ttp}</div>
            <div class="muted" style="margin-top:4px;"><b>Mitiqasiya:</b> ${actor.mitigation}</div>
            <div style="margin-top:10px;">
              <button class="small ${state.audience === "exec" ? "active" : ""}" onclick="state.audience='exec';render()">Rəhbərlik</button>
              <button class="small ${state.audience === "tech" ? "active" : ""}" onclick="state.audience='tech';render()">Texniki SOC</button>
            </div>
            <div class="muted" style="margin-top:8px;">${summary}</div>
          </div>
        `;
      }

      else {
        const srcs = state.data.sources || [];
        view.innerHTML = srcs.length ? srcs.map(s => `
          <div class="card">
            <span class="badge ok">Aktiv Mənbə</span>
            <div class="card-title">${s.name}</div>
            <a href="${s.url}" target="_blank" rel="noopener">${s.url}</a>
          </div>
        `).join("") : `<div class="card muted">Mənbələr <code>data.json</code> yaradıldıqdan sonra görünəcək.</div>`;
      }
    }

    fetch("./data.json?t=" + Date.now())
      .then(r => r.json())
      .then(d => {
        state.data = d;
        document.getElementById("updatedAt").innerText =
          `Son yenilənmə: ${d.updated_at} • Avto-cədvəl: 12:00 + hər 3 saat (+04)`;
        render();
      })
      .catch(() => render());
  </script>
</body>
</html>
