<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SOC & CTI Operativ Konsolu v2.1</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #070d19;
      --panel: #0f172a;
      --card: #111c33;
      --border: #1e293b;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --crit: #ef4444;
      --high: #f59e0b;
      --ok: #10b981;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: var(--tg-viewport-stable-height, 100vh);
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { padding: 12px; }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #172554 100%);
      border: 1px solid #2563eb55;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .header h1 { margin: 0; font-size: 17px; }
    .pill {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #10b98122;
      color: #6ee7b7;
      border: 1px solid #10b98155;
    }
    .sub { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.4; }
    .tabs, .row-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s ease;
    }
    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.small { padding: 6px 10px; font-size: 11px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .muted { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1d4ed833;
      color: #93c5fd;
      margin-right: 6px;
      margin-bottom: 6px;
    }
    .badge.crit { background: #dc262633; color: #fca5a5; }
    .badge.high { background: #d9770633; color: #fcd34d; }
    .badge.ok { background: #05966933; color: #6ee7b7; }
    pre {
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      overflow-x: auto;
      font-size: 12px;
      color: #a7f3d0;
      line-height: 1.45;
      margin: 8px 0;
    }
    input, select {
      width: 100%;
      background: #030712;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px;
      border-radius: 8px;
      background: #0b1324;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-size: 12px;
    }
    .check-item input { width: auto; margin: 2px 0 0; }
    a { color: #60a5fa; text-decoration: none; font-size: 12px; }
    .toast { color: #6ee7b7; font-size: 12px; margin-left: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <h1>🛡️ SOC & CTI Operativ Konsolu</h1>
      <span class="pill" id="statusPill">DYNAMIC v2.1</span>
    </div>
    <div class="sub" id="updatedAt">Yenilənmə vaxtı yüklənir... • Avto-cədvəl: 12:00 + hər 3 saat (+04)</div>
  </div>

  <div class="tabs" id="mainTabs">
    <button class="active" data-tab="news" onclick="switchTab('news')">📰 Xəbərlər</button>
    <button data-tab="cve" onclick="switchTab('cve')">⚠️ CISA CVE</button>
    <button data-tab="hunting" onclick="switchTab('hunting')">🎯 Hunting</button>
    <button data-tab="ioc" onclick="switchTab('ioc')">🔍 IoC & SOAR</button>
    <button data-tab="defense" onclick="switchTab('defense')">🧱 Müdafiə & Aktor</button>
    <button data-tab="sources" onclick="switchTab('sources')">📡 Mənbələr</button>
  </div>

  <div id="view"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    function goFullScreen() {
      if (!tg) return;
      tg.ready();
      tg.expand();
      if (typeof tg.requestFullscreen === "function") {
        try { tg.requestFullscreen(); } catch (e) {}
      }
    }
    goFullScreen();
    setTimeout(goFullScreen, 200);
    setTimeout(goFullScreen, 700);

    const state = {
      tab: "news",
      platform: "xql",
      scenario: "token_replay",
      targetScope: "*",
      windowHours: "24",
      severityFilter: "all",
      iocType: "ip",
      iocValue: "185.220.101.47",
      vpLayer: "waf",
      selectedActor: "armory_castle",
      audience: "exec",
      copied: "",
      soarLog: "",
      audit: { waf: true, ips: true, edr: false },
      data: { updated_at: "Yüklənir...", sources: [], news: [], cves: [] }
    };

    const SCENARIO_META = {
      token_replay: {
        title: "Token Replay & Session Hijacking (MFA Bypass)",
        mitre: "T1539 / T1550.004"
      },
      infostealer: {
        title: "Endpoint Infostealer (Login Data, Cookies & Session Theft)",
        mitre: "T1555.003 / T1539"
      },
      api_leak: {
        title: "API / Cloud Secret & Token Exfiltration",
        mitre: "T1552.001 / T1567"
      },
      rce_web: {
        title: "Web / Edge Exploitation & Suspicious Child Process",
        mitre: "T1190 / T1059"
      },
      c2_lateral: {
        title: "C2 Beaconing, Tunneling & Lateral Movement",
        mitre: "T1071 / T1570"
      }
    };

    function detectScenarioFromText(text) {
      const t = (text || "").toLowerCase();
      if (t.includes("rce") || t.includes("csrf") || t.includes("web") || t.includes("drupal") || t.includes("experimentation") || t.includes("exploit")) {
        return "rce_web";
      }
      if (t.includes("stealer") || t.includes("cookie") || t.includes("vishing") || t.includes("credential")) {
        return "infostealer";
      }
      if (t.includes("token") || t.includes("session") || t.includes("auth") || t.includes("hijack") || t.includes("mfa")) {
        return "token_replay";
      }
      if (t.includes("api") || t.includes("secret") || t.includes("cloud") || t.includes("key")) {
        return "api_leak";
      }
      return "c2_lateral";
    }

    function buildHuntingQuery(scenario, plat, scope, hours) {
      const s = (scope || "*").trim();
      const h = parseInt(hours || "24", 10) || 24;
      const scopeFilter = s === "*" ? "" : ` and (agent_hostname contains "${s}" or user_name contains "${s}" or action_remote_ip = "${s}")`;

      if (scenario === "token_replay") {
        if (plat === "xql") return `dataset = identity_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.AUTHENTICATION and auth_status = ENUM.SUCCESS${scopeFilter}\n| comp count_distinct(asn_org) as asns, count_distinct(user_agent) as uas by user_name, session_id\n| filter asns > 1 or uas > 1`;
        if (plat === "kql") return `SigninLogs\n| where TimeGenerated > ago(${h}h) and ResultType == 0${s !== "*" ? ` and (UserPrincipalName has "${s}" or IPAddress == "${s}")` : ""}\n| summarize ASNs=dcount(AutonomousSystemNumber), UAs=dcount(UserAgent) by UserPrincipalName, OriginalRequestId\n| where ASNs > 1 or UAs > 1`;
        if (plat === "spl") return `index=identity earliest=-${h}h status=success${s !== "*" ? ` ("${s}")` : ""}\n| stats dc(src_ip) as ips dc(http_user_agent) as uas by user, session_id\n| where ips > 1 OR uas > 1`;
        if (plat === "wazuh") return `data.win.eventdata.targetUserName:* AND rule.groups:authentication_success${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT username, UNIQUECOUNT(sourceip) AS ips, UNIQUECOUNT("User Agent") AS uas FROM events WHERE 1=1${s !== "*" ? ` AND ("Username" ILIKE '%${s}%' OR "Source IP" = '${s}')` : ""} GROUP BY username HAVING ips > 1 OR uas > 1 LAST ${h} HOURS`;
      }

      if (scenario === "infostealer") {
        if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.FILE and action_file_path ~= ".*(Chrome|Edge|Firefox)\\\\User Data\\\\.*(Login Data|Cookies|key4\\.db)$"${scopeFilter}\n| filter actor_process_image_name not in ("chrome.exe", "msedge.exe", "firefox.exe")`;
        if (plat === "kql") return `DeviceFileEvents\n| where Timestamp > ago(${h}h) and FolderPath has_any ("Chrome\\\\User Data", "Edge\\\\User Data") and FileName in~ ("Login Data", "Cookies")${s !== "*" ? ` and (DeviceName has "${s}" or InitiatingProcessAccountName has "${s}")` : ""}\n| where InitiatingProcessFileName !in~ ("chrome.exe", "msedge.exe")`;
        if (plat === "spl") return `index=endpoint earliest=-${h}h (file_path="*Chrome*Login Data*" OR file_path="*Cookies*") NOT process_name IN ("chrome.exe","msedge.exe")${s !== "*" ? ` ("${s}")` : ""}`;
        if (plat === "wazuh") return `data.win.eventdata.targetFilename:*User Data* AND NOT data.win.eventdata.image:*chrome.exe${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT hostname, "Process Name", "Target Filename" FROM events WHERE ("Target Filename" ILIKE '%Login Data%' OR "Target Filename" ILIKE '%Cookies%') AND "Process Name" NOT ILIKE '%chrome.exe'${s !== "*" ? ` AND hostname ILIKE '%${s}%'` : ""} LAST ${h} HOURS`;
      }

      if (scenario === "api_leak") {
        if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.FILE and action_file_path ~= ".*(\\.env|credentials|id_rsa|token|secret|kubeconfig).*"${scopeFilter}\n| fields _time, agent_hostname, actor_primary_username, actor_process_image_name, action_file_path`;
        if (plat === "kql") return `DeviceFileEvents\n| where Timestamp > ago(${h}h) and FileName has_any (".env", "credentials", "id_rsa", "secret", "token")${s !== "*" ? ` and DeviceName has "${s}"` : ""}\n| summarize Hits=count(), Files=make_set(FileName) by DeviceName, InitiatingProcessFileName`;
        if (plat === "spl") return `index=* earliest=-${h}h (".env" OR "id_rsa" OR "AWS_SECRET" OR "API_KEY" OR "BEARER")${s !== "*" ? ` ("${s}")` : ""}\n| stats count values(host) as hosts values(user) as users`;
        if (plat === "wazuh") return `(syscheck.path:*.env* OR data.win.eventdata.targetFilename:*.env*)${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT hostname, username, "Target Filename", COUNT(*) AS Hits FROM events WHERE ("Target Filename" ILIKE '%.env%' OR "Target Filename" ILIKE '%credentials%')${s !== "*" ? ` AND hostname ILIKE '%${s}%'` : ""} GROUP BY hostname, username, "Target Filename" LAST ${h} HOURS`;
      }

      if (scenario === "rce_web") {
        if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and actor_process_image_name in ("w3wp.exe","httpd","nginx","apache2","java","python3","node") and causality_actor_process_image_name in ("cmd.exe","powershell.exe","pwsh.exe","sh","bash")${scopeFilter}`;
        if (plat === "kql") return `DeviceProcessEvents\n| where Timestamp > ago(${h}h) and InitiatingProcessFileName has_any ("w3wp.exe","nginx","apache2","java","node") and FileName in~ ("cmd.exe","powershell.exe","pwsh.exe","sh","bash")${s !== "*" ? ` and DeviceName has "${s}"` : ""}`;
        if (plat === "spl") return `index=web earliest=-${h}h (status=500 OR status=403) (uri_path="*../*" OR uri_path="*cmd=*" OR uri_path="*eval*")${s !== "*" ? ` ("${s}")` : ""}\n| stats count by src_ip, uri_path, status`;
        if (plat === "wazuh") return `rule.groups:(web|attack) AND (data.srcip:* OR data.url:*)${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT "Source IP", hostname, "URL", COUNT(*) AS Hits FROM events WHERE ("URL" ILIKE '%../%' OR "URL" ILIKE '%cmd=%' OR "URL" ILIKE '%select+%')${s !== "*" ? ` AND ("Source IP" = '${s}' OR hostname ILIKE '%${s}%')` : ""} GROUP BY "Source IP", hostname, "URL" LAST ${h} HOURS`;
      }

      if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.NETWORK${scopeFilter}\n| comp count() as conn_cnt, count_distinct(action_remote_ip) as uniq_ips by agent_hostname, actor_process_image_name\n| filter conn_cnt > 50 or uniq_ips > 15`;
      if (plat === "kql") return `DeviceNetworkEvents\n| where Timestamp > ago(${h}h) and RemotePort in (4444, 8443, 9001, 1080, 5985)${s !== "*" ? ` and (DeviceName has "${s}" or RemoteIP == "${s}")` : ""}\n| summarize Count=count(), RemoteIPs=make_set(RemoteIP) by DeviceName, InitiatingProcessFileName`;
      if (plat === "spl") return `index=network earliest=-${h}h dest_port IN (4444,8443,9001,1080,5985)${s !== "*" ? ` ("${s}")` : ""}\n| stats count values(src_ip) as srcs values(dest_ip) as dsts by host`;
      if (plat === "wazuh") return `data.dstport:(4444 OR 8443 OR 9001 OR 1080)${s !== "*" ? ` AND "${s}"` : ""}`;
      return `SELECT hostname, "Source IP", "Destination IP", "Destination Port", COUNT(*) AS Hits FROM events WHERE "Destination Port" IN (4444,8443,9001,1080)${s !== "*" ? ` AND ("Source IP" = '${s}' OR "Destination IP" = '${s}')` : ""} GROUP BY hostname, "Source IP", "Destination IP", "Destination Port" LAST ${h} HOURS`;
    }

    function buildIocQuery(val, plat, hours) {
      const v = (val || "185.220.101.47").trim();
      const h = parseInt(hours || "24", 10) || 24;
      if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and (action_remote_ip = "${v}" or dns_query_name contains "${v}" or actor_process_image_sha256 = "${v}" or action_file_path contains "${v}")\n| fields _time, agent_hostname, actor_primary_username, actor_process_image_name, action_remote_ip`;
      if (plat === "kql") return `union DeviceNetworkEvents, DeviceProcessEvents, DeviceFileEvents\n| where Timestamp > ago(${h}h) and (RemoteIP == "${v}" or RemoteUrl has "${v}" or SHA256 == "${v}" or FolderPath has "${v}")`;
      if (plat === "spl") return `index=* earliest=-${h}h ("${v}")\n| stats count earliest(_time) as first_seen latest(_time) as last_seen values(host) as hosts values(user) as users`;
      if (plat === "wazuh") return `(data.srcip:${v} OR data.dstip:${v} OR data.dns.question.name:*${v}* OR syscheck.sha256:${v})`;
      return `SELECT hostname, username, "Source IP", "Destination IP", "URL" FROM events WHERE ("Source IP" = '${v}' OR "Destination IP" = '${v}' OR "URL" ILIKE '%${v}%') LAST ${h} HOURS`;
    }

    function copyVal(text, label = "Kopyalandı") {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      state.copied = "✓ " + label;
      render();
      setTimeout(() => { state.copied = ""; render(); }, 1600);
    }

    function runSoar(actionName) {
      const v = (state.iocValue || "185.220.101.47").trim();
      state.soarLog = `[${new Date().toLocaleTimeString("az-AZ")}] ${actionName} → Hədəf: ${v} (Status: Playbook Ready / Queued)`;
      render();
    }

    function switchTab(tab) {
      state.tab = tab;
      state.copied = "";
      document.querySelectorAll("#mainTabs button").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === tab);
      });
      render();
    }

    function platformBar(current, onSelectExpr) {
      return `<div class="row-scroll">${["xql", "kql", "spl", "wazuh", "aql"].map(p =>
        `<button class="${current === p ? "active" : ""}" onclick="${onSelectExpr.replace("__P__", p)}">${p.toUpperCase()}</button>`
      ).join("")}</div>`;
    }

    function render() {
      const view = document.getElementById("view");
      const toast = state.copied ? `<span class="toast">${state.copied}</span>` : "";

      if (state.tab === "news") {
        const news = state.data.news || [];
        view.innerHTML = news.length ? news.map(n => {
          const matchedScenario = detectScenarioFromText(`${n.title} ${n.summary}`);
          return `
            <div class="card">
              <span class="badge">${n.source}</span>
              <span class="badge ok">${n.date || ""}</span>
              <div class="card-title">${n.title}</div>
              <div class="muted" style="margin-bottom:8px;">${n.summary || ""}</div>
              <a href="${n.url}" target="_blank" rel="noopener">Mənbəni aç →</a>
              <div style="margin-top:8px;">
                <button class="small" onclick="state.scenario='${matchedScenario}';switchTab('hunting')">🎯 Uyğun Hunting (${matchedScenario})</button>
              </div>
            </div>
          `;
        }).join("") : `<div class="card muted">Hələ <code>data.json</code> məlumatı görünmür. GitHub Actions-ı işə salın.</div>`;
      }

      else if (state.tab === "cve") {
        const cves = state.data.cves || [];
        const filtered = cves.filter(c => state.severityFilter !== "ransomware" || String(c.ransomware || "").toLowerCase().includes("known"));
        view.innerHTML = `
          <div class="row-scroll">
            <button class="${state.severityFilter === "all" ? "active" : ""}" onclick="state.severityFilter='all';render()">Hamısı (${cves.length})</button>
            <button class="${state.severityFilter === "ransomware" ? "active" : ""}" onclick="state.severityFilter='ransomware';render()">Ransomware KEV</button>
          </div>
          ${filtered.map(c => {
            const sc = detectScenarioFromText(`${c.vendor} ${c.product} ${c.name} ${c.action}`);
            return `
              <div class="card">
                <span class="badge crit">${c.cveID}</span>
                <span class="badge high">${c.dateAdded || ""}</span>
                ${String(c.ransomware || "").toLowerCase().includes("known") ? `<span class="badge crit">Ransomware</span>` : ""}
                <div class="card-title">${c.vendor || ""} — ${c.product || ""}</div>
                <div class="muted" style="margin-bottom:6px;">${c.name || ""}</div>
                <div class="muted"><b>Tədbir:</b> ${c.action || "Yama tətbiq edin"}</div>
                <div style="margin-top:8px;">
                  <button class="small" onclick="state.iocValue='${c.cveID}';switchTab('ioc')">🔍 CVE IoC Sorğusu</button>
                  <button class="small" onclick="state.scenario='${sc}';state.targetScope='${c.cveID}';switchTab('hunting')">🎯 Dinamik Hunting</button>
                </div>
              </div>
            `;
          }).join("") || `<div class="card muted">Bu filtr üzrə CVE tapılmadı.</div>`}
        `;
      }

      else if (state.tab === "hunting") {
        const meta = SCENARIO_META[state.scenario];
        const queryText = buildHuntingQuery(state.scenario, state.platform, state.targetScope, state.windowHours);
        view.innerHTML = `
          <div class="row-scroll">
            ${Object.keys(SCENARIO_META).map(k =>
              `<button class="${state.scenario === k ? "active" : ""}" onclick="state.scenario='${k}';render()">${k.replace("_", " ").toUpperCase()}</button>`
            ).join("")}
          </div>
          ${platformBar(state.platform, "state.platform='__P__';render()")}
          <div class="card">
            <div class="grid-2">
              <input value="${state.targetScope}" oninput="state.targetScope=this.value;render()" placeholder="Hədəf (*, host, user, IP və ya CVE)..." />
              <select onchange="state.windowHours=this.value;render()">
                <option value="6" ${state.windowHours === "6" ? "selected" : ""}>Son 6 saat</option>
                <option value="24" ${state.windowHours === "24" ? "selected" : ""}>Son 24 saat</option>
                <option value="72" ${state.windowHours === "72" ? "selected" : ""}>Son 72 saat</option>
                <option value="168" ${state.windowHours === "168" ? "selected" : ""}>Son 7 gün</option>
              </select>
            </div>
            <span class="badge ok">${meta.mitre}</span>
            <div class="card-title">${meta.title}</div>
            <pre id="huntCode">${queryText}</pre>
            <button onclick="copyVal(document.getElementById('huntCode').innerText, 'Dinamik hunting sorğusu kopyalandı')">📋 Sorğunu kopyala</button>${toast}
          </div>
        `;
      }

      else if (state.tab === "ioc") {
        const q = buildIocQuery(state.iocValue, state.platform, state.windowHours);
        view.innerHTML = `
          <div class="card">
            <div class="card-title">Dinamik IoC Axtarışı & SOAR Reaksiya</div>
            <div class="grid-2">
              <select onchange="state.iocType=this.value;render()">
                <option value="ip" ${state.iocType === "ip" ? "selected" : ""}>IP Ünvanı</option>
                <option value="domain" ${state.iocType === "domain" ? "selected" : ""}>Domen / URL / CVE</option>
                <option value="hash" ${state.iocType === "hash" ? "selected" : ""}>SHA256 / File Hash</option>
              </select>
              <select onchange="state.windowHours=this.value;render()">
                <option value="24" ${state.windowHours === "24" ? "selected" : ""}>Son 24 saat</option>
                <option value="72" ${state.windowHours === "72" ? "selected" : ""}>Son 72 saat</option>
                <option value="168" ${state.windowHours === "168" ? "selected" : ""}>Son 7 gün</option>
              </select>
            </div>
            <input value="${state.iocValue}" oninput="state.iocValue=this.value;render()" placeholder="IP, domen, hash və ya CVE daxil et..." />
            ${platformBar(state.platform, "state.platform='__P__';render()")}
            <pre id="iocCode">${q}</pre>
            <button onclick="copyVal(document.getElementById('iocCode').innerText, 'IoC sorğusu kopyalandı')">📋 Sorğunu kopyala</button>
            <button onclick="runSoar('Block IoC at Perimeter/WAF')">🛡️ Blokla (WAF/FW)</button>
            <button onclick="runSoar('Revoke Active User Sessions')">🔑 Sessiyaları Ləğv Et</button>${toast}
            ${state.soarLog ? `<div class="muted" style="margin-top:8px;color:#6ee7b7;">${state.soarLog}</div>` : ""}
          </div>
        `;
      }

      else if (state.tab === "defense") {
        const layers = {
          waf: { name: "WAF & Edge Ingress", desc: "Web tətbiq hücumları və anomal sorğular sərhəddə bloklanır.", rule: "Block anomalous burst POST/API requests + validate session tokens." },
          ips: { name: "IPS / Perimetr & Tunnel", desc: "Gizli tunellər və qeyri-standart port çıxışları izlənilir.", rule: "Alert & drop unauthorized outbound C2/tunnel streams." },
          edr: { name: "EDR / Endpoint & Identity", desc: "Stealer prosesləri və token replay anomaliyaları tutulur.", rule: "Isolate host on browser DB access + revoke sessions on token anomaly." }
        };
        const actors = {
          armory_castle: { name: "Vishing & Cloud Identity Operators", ttp: "Voice/Vishing lures, token hijacking, cloud pivoting", mit: "Phishing-resistant MFA + session revocation." },
          stealer_eco: { name: "Infostealer & Log Brokering Ecosystem", ttp: "Browser cookie/session theft, SaaS/VPN credential reuse", mit: "Credential rotation + EDR file-access monitoring." }
        };
        const l = layers[state.vpLayer];
        const a = actors[state.selectedActor];
        view.innerHTML = `
          <div class="card">
            <div class="card-title">Müdafiə Qatları & Audit</div>
            <div class="row-scroll">
              <button class="${state.vpLayer === "waf" ? "active" : ""}" onclick="state.vpLayer='waf';render()">WAF / Edge</button>
              <button class="${state.vpLayer === "ips" ? "active" : ""}" onclick="state.vpLayer='ips';render()">IPS / Perimetr</button>
              <button class="${state.vpLayer === "edr" ? "active" : ""}" onclick="state.vpLayer='edr';render()">EDR / Identity</button>
            </div>
            <div class="muted"><b>${l.name}:</b> ${l.desc}</div>
            <pre>${l.rule}</pre>
            <label class="check-item"><input type="checkbox" ${state.audit.waf ? "checked" : ""} onchange="state.audit.waf=this.checked" /> WAF / Edge qaydaları aktivdir</label>
            <label class="check-item"><input type="checkbox" ${state.audit.ips ? "checked" : ""} onchange="state.audit.ips=this.checked" /> Perimetr / tunel logları yoxlanılıb</label>
            <label class="check-item"><input type="checkbox" ${state.audit.edr ? "checked" : ""} onchange="state.audit.edr=this.checked" /> EDR stealer/token alertləri triage edilib</label>
          </div>
          <div class="card">
            <div class="card-title">Aktorlar & Xülasə</div>
            <div class="row-scroll">
              <button class="${state.selectedActor === "armory_castle" ? "active" : ""}" onclick="state.selectedActor='armory_castle';render()">Identity / Vishing</button>
              <button class="${state.selectedActor === "stealer_eco" ? "active" : ""}" onclick="state.selectedActor='stealer_eco';render()">Infostealer / Logs</button>
            </div>
            <div class="muted"><b>${a.name}:</b> ${a.ttp}</div>
            <div class="muted" style="margin-top:4px;"><b>Mitiqasiya:</b> ${a.mit}</div>
            <div style="margin-top:10px;">
              <button class="small ${state.audience === "exec" ? "active" : ""}" onclick="state.audience='exec';render()">Rəhbərlik</button>
              <button class="small ${state.audience === "tech" ? "active" : ""}" onclick="state.audience='tech';render()">Texniki SOC</button>
            </div>
            <div class="muted" style="margin-top:8px;">${state.audience === "exec"
              ? "Xülasə: Aktiv KEV zəiflikləri və kimlik/stealer cəhdləri 3 saatlıq radarla izlənir; kritik sistemlərdə yama və sessiya nəzarəti əsasdır."
              : "Texniki Xülasə: Seçilmiş hədəf, zaman pəncərəsi və platformaya (XQL/KQL/SPL/Wazuh/AQL) uyğun sorğular dinamik generasiya olunur."
            }</div>
          </div>
        `;
      }

      else {
        const srcs = state.data.sources || [];
        view.innerHTML = srcs.length ? srcs.map(s => `
          <div class="card">
            <span class="badge ok">Aktiv Mənbə</span>
            <div class="card-title">${s.name}</div>
            <a href="${s.url}" target="_blank" rel="noopener">${s.url}</a>
          </div>
        `).join("") : `<div class="card muted">Mənbələr <code>data.json</code> yaradıldıqdan sonra görünəcək.</div>`;
      }
    }

    fetch("./data.json?t=" + Date.now())
      .then(r => r.json())
      .then(d => {
        state.data = d;
        document.getElementById("updatedAt").innerText =
          `Son yenilənmə: ${d.updated_at} • Avto-cədvəl: 12:00 + hər 3 saat (+04)`;
        render();
      })
      .catch(() => render());
  </script>
</body>
</html>
