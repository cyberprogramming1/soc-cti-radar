<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DEEP CTI & SOC Operativ Konsolu</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #070d19;
      --panel: #0f172a;
      --card: #111c33;
      --border: #26354f;
      --accent: #3b82f6;
      --text: #f8fafc;
      --subtext: #cbd5e1;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: var(--tg-viewport-stable-height, 100vh);
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { padding: 12px; }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #172554 100%);
      border: 1px solid #3b82f666;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .header h1 { margin: 0; font-size: 17px; color: var(--text); }
    .pill {
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #10b98126;
      color: #6ee7b7;
      border: 1px solid #10b98166;
      font-weight: 600;
    }
    .sub { color: var(--subtext); font-size: 12px; margin-top: 6px; line-height: 1.4; }
    .tabs, .row-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s ease;
    }
    button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }
    button.small { padding: 6px 10px; font-size: 11px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-title { font-weight: 700; font-size: 14px; margin-bottom: 6px; line-height: 1.35; color: var(--text); }
    .muted { color: var(--subtext); font-size: 12px; line-height: 1.45; }
    .orig-box {
      margin-top: 6px;
      padding: 8px;
      border-radius: 8px;
      background: #070e1d;
      border: 1px dashed #3b4f70;
      color: var(--subtext);
      font-size: 11px;
      line-height: 1.4;
    }
    .status-box {
      margin-top: 8px;
      padding: 10px;
      border-radius: 9px;
      background: #081021;
      border-left: 3px solid var(--accent);
      color: var(--text);
      font-size: 12px;
      line-height: 1.45;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1d4ed844;
      color: #bfdbfe;
      margin-right: 6px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .badge.crit { background: #dc262644; color: #fecaca; }
    .badge.high { background: #d9770644; color: #fde68a; }
    .badge.med { background: #ca8a0444; color: #fef08a; }
    .badge.ok { background: #05966944; color: #a7f3d0; }
    .badge.dw { background: #7e22ce44; color: #e9d5ff; }
    pre {
      background: #030712;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      overflow-x: auto;
      font-size: 12px;
      color: #a7f3d0;
      line-height: 1.45;
      margin: 8px 0;
    }
    input, select {
      width: 100%;
      background: #030712;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    a { color: #93c5fd; text-decoration: none; font-size: 12px; }
    .toast { color: #6ee7b7; font-size: 12px; margin-left: 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <h1>🛡️ DEEP CTI & SOC Konsolu</h1>
      <span class="pill">LIVE CTI • MITRE ATT&CK</span>
    </div>
    <div class="sub" id="updatedAt">Yenilənmə vaxtı yüklənir... • Avto-cədvəl: 12:00 + hər 3 saat (+04)</div>
  </div>

  <div class="tabs" id="mainTabs">
    <button class="active" data-tab="news" onclick="switchTab('news')">📰 Xəbərlər</button>
    <button data-tab="cve" onclick="switchTab('cve')">⚠️ CISA CVE</button>
    <button data-tab="hunting" onclick="switchTab('hunting')">🎯 Hunting</button>
    <button data-tab="ioc" onclick="switchTab('ioc')">🔍 IoC & SOAR</button>
    <button data-tab="apt" onclick="switchTab('apt')">🕵️ APT Groups</button>
    <button data-tab="sources" onclick="switchTab('sources')">📡 Mənbələr</button>
  </div>

  <div id="view"></div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    function goFullScreen() {
      if (!tg) return;
      tg.ready();
      tg.expand();
      if (typeof tg.requestFullscreen === "function") {
        try { tg.requestFullscreen(); } catch (e) {}
      }
    }
    goFullScreen();
    setTimeout(goFullScreen, 200);
    setTimeout(goFullScreen, 700);

    const state = {
      tab: "news",
      newsCategory: "all",
      showOriginal: {},
      severityFilter: "all",
      platform: "xql",
      scenario: "token_replay",
      targetScope: "*",
      windowHours: "24",
      levelFilter: "ALL",
      iocValue: "",
      aptCategory: "all",
      aptSearch: "",
      copied: "",
      soarPlaybook: "",
      data: { updated_at: "Yüklənir...", sources: [], news: [], cves: [], iocs: [], active_apts: [] }
    };

    const SCENARIO_META = {
      token_replay: { title: "Token Replay & Session Hijacking (MFA Bypass)", mitre: "T1539 / T1550.004" },
      infostealer: { title: "Endpoint Infostealer (Login Data, Cookies & Session Theft)", mitre: "T1555.003 / T1539" },
      api_leak: { title: "API / Cloud Secret & Token Exfiltration", mitre: "T1552.001 / T1567" },
      rce_web: { title: "Web / Edge Exploitation & Suspicious Child Process", mitre: "T1190 / T1059" },
      c2_lateral: { title: "C2 Beaconing, Tunneling & Lateral Movement", mitre: "T1071 / T1570" }
    };

    function detectScenarioFromText(text) {
      const t = (text || "").toLowerCase();
      if (t.includes("rce") || t.includes("csrf") || t.includes("web") || t.includes("drupal") || t.includes("exploit")) return "rce_web";
      if (t.includes("stealer") || t.includes("cookie") || t.includes("vishing") || t.includes("credential")) return "infostealer";
      if (t.includes("token") || t.includes("session") || t.includes("auth") || t.includes("hijack") || t.includes("mfa")) return "token_replay";
      if (t.includes("api") || t.includes("secret") || t.includes("cloud") || t.includes("key")) return "api_leak";
      return "c2_lateral";
    }

    function levelBadgeClass(lvl) {
      if (lvl === "CRITICAL") return "crit";
      if (lvl === "HIGH") return "high";
      if (lvl === "MEDIUM") return "med";
      return "ok";
    }

    function evaluateManualIoc(rawVal) {
      const v = (rawVal || "").trim();
      if (!v) return null;
      const matched = (state.data.iocs || []).find(x => String(x.value || "").toLowerCase() === v.toLowerCase());
      if (matched) {
        return {
          value: matched.value,
          level: matched.level || "LOW",
          score: matched.score || 10,
          verdict: matched.verdict || "Alət analizi tamamlandı.",
          toolSummary: matched.tool_summary || (matched.reasons || []).join(", ")
        };
      }
      if (/^CVE-\d{4}-\d{4,7}$/i.test(v)) {
        return {
          value: v.toUpperCase(),
          level: "HIGH",
          score: 65,
          verdict: "CVE indikatoru — zəiflik və aktiv istismar statusu üzrə prioritet yoxlama tələb edir.",
          toolSummary: "Avtomatik CVE status qaydası"
        };
      }
      if (/^(?:\d{1,3}\.){3}\d{1,3}$/.test(v)) {
        return {
          value: v,
          level: "MEDIUM",
          score: 25,
          verdict: "Xarici IP ünvanı — aktiv zərərli siqnal qeydə alınmayıb, loqlarda bağlantı izini yoxlayın.",
          toolSummary: "Avtomatik IP status analizi"
        };
      }
      return {
        value: v,
        level: "LOW",
        score: 15,
        verdict: "İlkin status — əlavə təhlükə əlaməti aşkarlanmadı.",
        toolSummary: "Avtomatik status analizi"
      };
    }

    function buildHuntingQuery(scenario, plat, scope, hours) {
      const s = (scope || "*").trim();
      const h = parseInt(hours || "24", 10) || 24;
      const scopeFilter = s === "*" ? "" : ` and (agent_hostname contains "${s}" or user_name contains "${s}" or action_remote_ip = "${s}")`;

      if (scenario === "token_replay") {
        if (plat === "xql") return `dataset = identity_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.AUTHENTICATION and auth_status = ENUM.SUCCESS${scopeFilter}\n| comp count_distinct(asn_org) as asns, count_distinct(user_agent) as uas by user_name, session_id\n| filter asns > 1 or uas > 1`;
        if (plat === "kql") return `SigninLogs\n| where TimeGenerated > ago(${h}h) and ResultType == 0${s !== "*" ? ` and (UserPrincipalName has "${s}" or IPAddress == "${s}")` : ""}\n| summarize ASNs=dcount(AutonomousSystemNumber), UAs=dcount(UserAgent) by UserPrincipalName, OriginalRequestId\n| where ASNs > 1 or UAs > 1`;
        if (plat === "spl") return `index=identity earliest=-${h}h status=success${s !== "*" ? ` ("${s}")` : ""}\n| stats dc(src_ip) as ips dc(http_user_agent) as uas by user, session_id\n| where ips > 1 OR uas > 1`;
        if (plat === "wazuh") return `data.win.eventdata.targetUserName:* AND rule.groups:authentication_success${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT username, UNIQUECOUNT(sourceip) AS ips, UNIQUECOUNT("User Agent") AS uas FROM events WHERE 1=1${s !== "*" ? ` AND ("Username" ILIKE '%${s}%' OR "Source IP" = '${s}')` : ""} GROUP BY username HAVING ips > 1 OR uas > 1 LAST ${h} HOURS`;
      }

      if (scenario === "infostealer") {
        if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.FILE and action_file_path ~= ".*(Chrome|Edge|Firefox)\\\\User Data\\\\.*(Login Data|Cookies|key4\\.db)$"${scopeFilter}\n| filter actor_process_image_name not in ("chrome.exe", "msedge.exe", "firefox.exe")`;
        if (plat === "kql") return `DeviceFileEvents\n| where Timestamp > ago(${h}h) and FolderPath has_any ("Chrome\\\\User Data", "Edge\\\\User Data") and FileName in~ ("Login Data", "Cookies")${s !== "*" ? ` and (DeviceName has "${s}" or InitiatingProcessAccountName has "${s}")` : ""}\n| where InitiatingProcessFileName !in~ ("chrome.exe", "msedge.exe")`;
        if (plat === "spl") return `index=endpoint earliest=-${h}h (file_path="*Chrome*Login Data*" OR file_path="*Cookies*") NOT process_name IN ("chrome.exe","msedge.exe")${s !== "*" ? ` ("${s}")` : ""}`;
        if (plat === "wazuh") return `data.win.eventdata.targetFilename:*User Data* AND NOT data.win.eventdata.image:*chrome.exe${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT hostname, "Process Name", "Target Filename" FROM events WHERE ("Target Filename" ILIKE '%Login Data%' OR "Target Filename" ILIKE '%Cookies%') AND "Process Name" NOT ILIKE '%chrome.exe'${s !== "*" ? ` AND hostname ILIKE '%${s}%'` : ""} LAST ${h} HOURS`;
      }

      if (scenario === "api_leak") {
        if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.FILE and action_file_path ~= ".*(\\.env|credentials|id_rsa|token|secret|kubeconfig).*"${scopeFilter}\n| fields _time, agent_hostname, actor_primary_username, actor_process_image_name, action_file_path`;
        if (plat === "kql") return `DeviceFileEvents\n| where Timestamp > ago(${h}h) and FileName has_any (".env", "credentials", "id_rsa", "secret", "token")${s !== "*" ? ` and DeviceName has "${s}"` : ""}\n| summarize Hits=count(), Files=make_set(FileName) by DeviceName, InitiatingProcessFileName`;
        if (plat === "spl") return `index=* earliest=-${h}h (".env" OR "id_rsa" OR "AWS_SECRET" OR "API_KEY" OR "BEARER")${s !== "*" ? ` ("${s}")` : ""}\n| stats count values(host) as hosts values(user) as users`;
        if (plat === "wazuh") return `(syscheck.path:*.env* OR data.win.eventdata.targetFilename:*.env*)${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT hostname, username, "Target Filename", COUNT(*) AS Hits FROM events WHERE ("Target Filename" ILIKE '%.env%' OR "Target Filename" ILIKE '%credentials%')${s !== "*" ? ` AND hostname ILIKE '%${s}%'` : ""} GROUP BY hostname, username, "Target Filename" LAST ${h} HOURS`;
      }

      if (scenario === "rce_web") {
        if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and actor_process_image_name in ("w3wp.exe","httpd","nginx","apache2","java","python3","node") and causality_actor_process_image_name in ("cmd.exe","powershell.exe","pwsh.exe","sh","bash")${scopeFilter}`;
        if (plat === "kql") return `DeviceProcessEvents\n| where Timestamp > ago(${h}h) and InitiatingProcessFileName has_any ("w3wp.exe","nginx","apache2","java","node") and FileName in~ ("cmd.exe","powershell.exe","pwsh.exe","sh","bash")${s !== "*" ? ` and DeviceName has "${s}"` : ""}`;
        if (plat === "spl") return `index=web earliest=-${h}h (status=500 OR status=403) (uri_path="*../*" OR uri_path="*cmd=*" OR uri_path="*eval*")${s !== "*" ? ` ("${s}")` : ""}\n| stats count by src_ip, uri_path, status`;
        if (plat === "wazuh") return `rule.groups:(web|attack) AND (data.srcip:* OR data.url:*)${s !== "*" ? ` AND "${s}"` : ""}`;
        return `SELECT "Source IP", hostname, "URL", COUNT(*) AS Hits FROM events WHERE ("URL" ILIKE '%../%' OR "URL" ILIKE '%cmd=%' OR "URL" ILIKE '%select+%')${s !== "*" ? ` AND ("Source IP" = '${s}' OR hostname ILIKE '%${s}%')` : ""} GROUP BY "Source IP", hostname, "URL" LAST ${h} HOURS`;
      }

      if (plat === "xql") return `dataset = xdr_data\n| filter _time >= current_time() - ${h}h and event_type = ENUM.NETWORK${scopeFilter}\n| comp count() as conn_cnt, count_distinct(action_remote_ip) as uniq_ips by agent_hostname, actor_process_image_name\n| filter conn_cnt > 50 or uniq_ips > 15`;
      if (plat === "kql") return `DeviceNetworkEvents\n| where Timestamp > ago(${h}h) and RemotePort in (4444, 8443, 9001, 1080, 5985)${s !== "*" ? ` and (DeviceName has "${s}" or RemoteIP == "${s}")` : ""}\n| summarize Count=count(), RemoteIPs=make_set(RemoteIP) by DeviceName, InitiatingProcessFileName`;
      if (plat === "spl") return `index=network earliest=-${h}h dest_port IN (4444,8443,9001,1080,5985)${s !== "*" ? ` ("${s}")` : ""}\n| stats count values(src_ip) as srcs values(dest_ip) as dsts by host`;
      if (plat === "wazuh") return `data.dstport:(4444 OR 8443 OR 9001 OR 1080)${s !== "*" ? ` AND "${s}"` : ""}`;
      return `SELECT hostname, "Source IP", "Destination IP", "Destination Port", COUNT(*) AS Hits FROM events WHERE "Destination Port" IN (4444,8443,9001,1080)${s !== "*" ? ` AND ("Source IP" = '${s}' OR "Destination IP" = '${s}')` : ""} GROUP BY hostname, "Source IP", "Destination IP", "Destination Port" LAST ${h} HOURS`;
    }

    function buildSoarCommand(actionType, target) {
      const v = (target || "target").trim();
      if (actionType === "block") {
        return `# Bloklama Əmri (${v})\niptables -I INPUT -s ${v} -j DROP && iptables -I OUTPUT -d ${v} -j DROP`;
      }
      return `# Sessiya Ləğvi Əmri (${v})\nRevoke-MgUserSignInSession -UserId "${v}"`;
    }

    function copyVal(text, label = "Kopyalandı") {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      state.copied = "✓ " + label;
      render();
      setTimeout(() => { state.copied = ""; render(); }, 1600);
    }

    function switchTab(tab) {
      state.tab = tab;
      state.copied = "";
      document.querySelectorAll("#mainTabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
      render();
    }

    function platformBar(current, onSelectExpr) {
      return `<div class="row-scroll">${["xql", "kql", "spl", "wazuh", "aql"].map(p =>
        `<button class="${current === p ? "active" : ""}" onclick="${onSelectExpr.replace("__P__", p)}">${p.toUpperCase()}</button>`
      ).join("")}</div>`;
    }

    function render() {
      const view = document.getElementById("view");
      const toast = state.copied ? `<span class="toast">${state.copied}</span>` : "";

      if (state.tab === "news") {
        const allNews = state.data.news || [];
        const filtered = allNews.filter(n => state.newsCategory === "all" || (n.category || "global_cyber") === state.newsCategory);

        view.innerHTML = `
          <div class="row-scroll">
            <button class="${state.newsCategory === "all" ? "active" : ""}" onclick="state.newsCategory='all';render()">Hamısı (${allNews.length})</button>
            <button class="${state.newsCategory === "darkweb_cti" ? "active" : ""}" onclick="state.newsCategory='darkweb_cti';render()">🕵️ Darkweb & Leak</button>
            <button class="${state.newsCategory === "global_cyber" ? "active" : ""}" onclick="state.newsCategory='global_cyber';render()">🌍 Dünya Kiber</button>
          </div>
          ${filtered.length ? filtered.map((n, idx) => {
            const key = `${state.newsCategory}_${idx}`;
            const showOrig = !!state.showOriginal[key];
            const titleAz = n.title_az || n.title;
            const summaryAz = n.summary_az || n.summary || "";
            const isDw = (n.category === "darkweb_cti");
            const sc = detectScenarioFromText(`${n.title} ${n.summary}`);
            return `
              <div class="card">
                <span class="badge ${isDw ? "dw" : ""}">${isDw ? "DARKWEB / CTI" : "GLOBAL CYBER"}</span>
                <span class="badge">${n.source}</span>
                <span class="badge ok">${n.date || ""}</span>
                <div class="card-title">${titleAz}</div>
                <div class="muted" style="margin-bottom:8px;">${summaryAz}</div>
                <div class="row-scroll" style="margin-bottom:4px;">
                  <a href="${n.url}" target="_blank" rel="noopener"><button type="button" class="small">Mənbəni aç →</button></a>
                  <button type="button" class="small" onclick="state.showOriginal['${key}']=!state.showOriginal['${key}'];render()">
                    ${showOrig ? "Orijinalı gizlə" : "🌐 Orijinal mətn"}
                  </button>
                  <button type="button" class="small" onclick="state.scenario='${sc}';switchTab('hunting')">🎯 Hunting (${sc})</button>
                </div>
                ${showOrig ? `<div class="orig-box"><b>Orijinal:</b> ${n.title}<br/>${n.summary || ""}</div>` : ""}
              </div>
            `;
          }).join("") : `<div class="card muted">Bu kateqoriyada xəbər tapılmadı. GitHub Actions-ı işə salın.</div>`}
        `;
      }

      else if (state.tab === "cve") {
        const cves = state.data.cves || [];
        const filtered = cves.filter(c => state.severityFilter !== "ransomware" || String(c.ransomware || "").toLowerCase().includes("known"));
        view.innerHTML = `
          <div class="row-scroll">
            <button class="${state.severityFilter === "all" ? "active" : ""}" onclick="state.severityFilter='all';render()">Hamısı (${cves.length})</button>
            <button class="${state.severityFilter === "ransomware" ? "active" : ""}" onclick="state.severityFilter='ransomware';render()">Ransomware KEV</button>
          </div>
          ${filtered.length ? filtered.map(c => {
            const sc = detectScenarioFromText(`${c.vendor} ${c.product} ${c.name} ${c.action}`);
            return `
              <div class="card">
                <span class="badge crit">${c.cveID}</span>
                <span class="badge high">${c.dateAdded || ""}</span>
                ${String(c.ransomware || "").toLowerCase().includes("known") ? `<span class="badge crit">Ransomware</span>` : ""}
                <div class="card-title">${c.vendor || ""} — ${c.product || ""}</div>
                <div style="font-size:13px;margin-bottom:4px;">${c.name_az || c.name || ""}</div>
                <div class="muted" style="margin-bottom:6px;"><b>Tədbir (AZ):</b> ${c.action_az || c.action || "Yama tətbiq edin"}</div>
                <div class="row-scroll" style="margin-bottom:0;">
                  <button class="small" onclick="state.iocValue='${c.cveID}';switchTab('ioc')">🔍 IoC Status</button>
                  <button class="small" onclick="state.scenario='${sc}';state.targetScope='${c.cveID}';switchTab('hunting')">🎯 Hunting</button>
                </div>
              </div>
            `;
          }).join("") : `<div class="card muted">CVE siyahısı boşdur.</div>`}
        `;
      }

      else if (state.tab === "hunting") {
        const meta = SCENARIO_META[state.scenario];
        const queryText = buildHuntingQuery(state.scenario, state.platform, state.targetScope, state.windowHours);
        view.innerHTML = `
          <div class="row-scroll">
            ${Object.keys(SCENARIO_META).map(k =>
              `<button class="${state.scenario === k ? "active" : ""}" onclick="state.scenario='${k}';render()">${k.replace("_", " ").toUpperCase()}</button>`
            ).join("")}
          </div>
          ${platformBar(state.platform, "state.platform='__P__';render()")}
          <div class="card">
            <div class="grid-2">
              <input value="${state.targetScope}" oninput="state.targetScope=this.value;render()" placeholder="Hədəf (*, host, user, IP, CVE, APT)..." />
              <select onchange="state.windowHours=this.value;render()">
                <option value="6" ${state.windowHours === "6" ? "selected" : ""}>Son 6 saat</option>
                <option value="24" ${state.windowHours === "24" ? "selected" : ""}>Son 24 saat</option>
                <option value="72" ${state.windowHours === "72" ? "selected" : ""}>Son 72 saat</option>
                <option value="168" ${state.windowHours === "168" ? "selected" : ""}>Son 7 gün</option>
              </select>
            </div>
            <span class="badge ok">${meta.mitre}</span>
            <div class="card-title">${meta.title}</div>
            <pre id="huntBox">${queryText}</pre>
            <button onclick="copyVal(document.getElementById('huntBox').innerText, 'Hunting sorğusu kopyalandı')">📋 Sorğunu kopyala</button>${toast}
          </div>
        `;
      }

      else if (state.tab === "ioc") {
        const allIocs = state.data.iocs || [];
        const filteredIocs = allIocs.filter(x => state.levelFilter === "ALL" || x.level === state.levelFilter);
        const manualRes = evaluateManualIoc(state.iocValue);

        view.innerHTML = `
          <div class="card">
            <div class="card-title">Avtomatik IoC Status & Nəticə</div>
            <div class="muted" style="margin-bottom:8px;">İndikator daxil edin və ya aşağıdakı siyahıdan seçin — yalnız yekun status və nəticə göstərilir.</div>
            <input value="${state.iocValue}" oninput="state.iocValue=this.value;render()" placeholder="IP, domen, URL, hash və ya CVE daxil edin..." />
            ${manualRes ? `
              <div class="status-box">
                <span class="badge ${levelBadgeClass(manualRes.level)}">STATUS: ${manualRes.level} (${manualRes.score})</span>
                <div style="font-weight:700;margin-bottom:4px;">${manualRes.value}</div>
                <div><b>Nəticə:</b> ${manualRes.verdict}</div>
                <div class="muted" style="margin-top:4px;">${manualRes.toolSummary}</div>
              </div>
            ` : ""}
            <div class="row-scroll" style="margin-top:8px;">
              <button class="small" onclick="state.soarPlaybook=buildSoarCommand('block', state.iocValue);render()">🛡️ Blokla Əmri</button>
              <button class="small" onclick="state.soarPlaybook=buildSoarCommand('revoke', state.iocValue);render()">🔑 Sessiya Ləğvi</button>
              ${state.soarPlaybook ? `<button class="small" onclick="copyVal(state.soarPlaybook, 'Əmr kopyalandı')">📋 Əmri kopyala</button>` : ""}
            </div>
            ${toast}
            ${state.soarPlaybook ? `<pre>${state.soarPlaybook}</pre>` : ""}
          </div>

          <div class="card">
            <div class="card-title">Aşkarlanan IoC-lər (${filteredIocs.length}/${allIocs.length})</div>
            <div class="row-scroll">
              ${["ALL", "CRITICAL", "HIGH", "MEDIUM", "LOW"].map(lvl =>
                `<button class="small ${state.levelFilter === lvl ? "active" : ""}" onclick="state.levelFilter='${lvl}';render()">${lvl}</button>`
              ).join("")}
            </div>
            ${filteredIocs.length ? filteredIocs.map(item => `
              <div style="border-top:1px solid var(--border);padding:8px 0;">
                <span class="badge ${levelBadgeClass(item.level)}">${item.level} (${item.score})</span>
                <span class="badge">${(item.type || "ioc").toUpperCase()}</span>
                <div style="font-weight:700;font-size:13px;word-break:break-all;margin-bottom:3px;">${item.value}</div>
                <div style="font-size:12px;"><b>Nəticə:</b> ${item.verdict || (item.reasons || []).join(", ")}</div>
                <div class="muted" style="margin-top:3px;">${item.tool_summary || ""}</div>
                <div style="margin-top:6px;">
                  <button class="small" onclick="state.iocValue='${String(item.value).replace(/'/g, "\\'")}';render()">📌 Statusu göstər</button>
                </div>
              </div>
            `).join("") : `<div class="muted">Seçilmiş səviyyədə IoC yoxdur.</div>`}
          </div>
        `;
      }

      else if (state.tab === "apt") {
        const apts = state.data.active_apts || [];
        const q = (state.aptSearch || "").trim().toLowerCase();
        const list = apts.filter(a => {
          const catOk = state.aptCategory === "all" || a.category === state.aptCategory;
          const techStr = (a.techniques || []).map(t => `${t.id} ${t.name} ${t.tactic || ""}`).join(" ");
          const textOk = !q || `${a.name} ${a.focus} ${a.mitigation} ${techStr}`.toLowerCase().includes(q);
          return catOk && textOk;
        });

        view.innerHTML = `
          <div class="card">
            <div class="card-title">🕵️ Mənbələrdə Aşkarlanan Real APT Qrupları & MITRE ATT&CK</div>
            <div class="muted" style="margin-bottom:8px;">
              Yalnız o an toplanan xəbərlərdə və CISA KEV məlumatlarında birbaşa qeyd olunan APT qrupları göstərilir.
            </div>
            <input value="${state.aptSearch}" oninput="state.aptSearch=this.value;render()" placeholder="APT, MITRE texnikası (T1190, T1539...), hədəf axtar..." />
            <div class="row-scroll">
              <button class="small ${state.aptCategory === "all" ? "active" : ""}" onclick="state.aptCategory='all';render()">Hamısı (${apts.length})</button>
              <button class="small ${state.aptCategory === "espionage" ? "active" : ""}" onclick="state.aptCategory='espionage';render()">Casusluq / Cloud</button>
              <button class="small ${state.aptCategory === "infra" ? "active" : ""}" onclick="state.aptCategory='infra';render()">İnfrastruktur / OT</button>
              <button class="small ${state.aptCategory === "finance" ? "active" : ""}" onclick="state.aptCategory='finance';render()">Maliyyə / Kripto</button>
              <button class="small ${state.aptCategory === "identity" ? "active" : ""}" onclick="state.aptCategory='identity';render()">Kimlik / Vishing</button>
            </div>
          </div>
          ${list.length ? list.map(a => {
            const techs = a.techniques || [];
            const mentions = a.mentions || [];
            const scopeVal = (a.name || "APT").split(" ")[0];
            return `
              <div class="card">
                <span class="badge ${levelBadgeClass(a.level)}">${a.level} • Score ${a.activity_score}</span>
                <span class="badge ok">${a.status_label}</span>
                <div class="card-title">${a.name}</div>
                <div class="muted" style="margin-bottom:4px;"><b>Hədəflər:</b> ${a.focus}</div>
                <div class="muted" style="margin-bottom:6px;"><b>Mitiqasiya:</b> ${a.mitigation}</div>
                <div style="margin-bottom:8px;">
                  <div class="muted" style="margin-bottom:4px;"><b>MITRE ATT&CK Texnikaları:</b></div>
                  ${techs.map(t => `<a href="${t.url || `https://attack.mitre.org/techniques/${String(t.id).replace('.', '/')}/`}" target="_blank" rel="noopener"><span class="badge">${t.id} — ${t.name}</span></a>`).join("")}
                </div>
                ${mentions.length ? `
                  <div class="orig-box" style="margin-bottom:8px;">
                    <b>Mənbədə tapılan qeydlər:</b><br/>
                    ${mentions.map(m => `• [${m.source}] ${m.title}`).join("<br/>")}
                  </div>
                ` : ""}
                <button class="small" onclick="state.scenario='${a.scenario || "token_replay"}';state.targetScope='${scopeVal}';switchTab('hunting')">🎯 Bu APT üzrə Hunting</button>
              </div>
            `;
          }).join("") : `<div class="card muted">Bu toplama dövründə mənbələrdə birbaşa adı çəkilən APT qrupu aşkarlanmadı.</div>`}
        `;
      }

      else {
        const srcs = state.data.sources || [];
        view.innerHTML = srcs.length ? srcs.map(s => `
          <div class="card">
            <span class="badge ok">${s.type || "Mənbə"}</span>
            <div class="card-title">${s.name}</div>
            <a href="${s.url}" target="_blank" rel="noopener">${s.url}</a>
          </div>
        `).join("") : `<div class="card muted">Mənbələr yüklənməyib.</div>`;
      }
    }

    fetch("./data.json?t=" + Date.now())
      .then(r => r.json())
      .then(d => {
        const iocList = d.iocs || [];
        const aptList = d.active_apts || [];
        state.data = {
          ...state.data,
          ...d,
          active_apts: aptList
        };
        if (!state.iocValue && iocList.length) {
          state.iocValue = iocList[0].value;
        }
        document.getElementById("updatedAt").innerText =
          `Son yenilənmə: ${d.updated_at} • Mənbə: ${(d.sources || []).length} • Tapılan APT: ${aptList.length} • IoC: ${iocList.length}`;
        render();
      })
      .catch(() => render());
  </script>
</body>
</html>
