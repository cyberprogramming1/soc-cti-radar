name: DEEP CTI Live (Tor + 5 API)

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      custom_ioc:
        description: 'Manual IoC to analyze (IP, domain, hash, URL, CVE)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Tor for .onion sources
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tor
          sudo service tor start
          for i in $(seq 1 15); do
            if nc -z 127.0.0.1 9050 2>/dev/null; then
              echo "Tor SOCKS5 ready on 127.0.0.1:9050"
              break
            fi
            sleep 1
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CTI Collector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
          SHODAN_API_KEY: ${{ secrets.SHODAN_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          URLHAUS_AUTH_KEY: ${{ secrets.URLHAUS_AUTH_KEY }}
          CUSTOM_IOC: ${{ github.event.inputs.custom_ioc }}
        run: python collector.py

      - name: Commit and push updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update CTI data"
          git push
