name: SOC CTI 3-Hour Radar

on:
  schedule:
    # Bakı vaxtı (+04): 12:00, 15:00, 18:00, 21:00, 00:00, 03:00, 06:00, 09:00
    - cron: '0 8,11,14,17,20,23,2,5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CTI Collector & Send Telegram Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
        run: python collector.py

      - name: Commit updated data.json
        run: |
          git config user.name "SOC-CTI-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update CTI feed" && git push)
